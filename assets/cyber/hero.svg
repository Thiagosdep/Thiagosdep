<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="Thiago Sousa de Paiva, backend engineer. Cyberpunk HUD with a glitching name and a neural network carrying signals.">
<title>Thiago Sousa de Paiva, backend engineer. Cyberpunk HUD with a glitching name and a neural network carrying signals.</title>
<style>
text{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

@keyframes jit{0%,82%,100%{transform:translate(0,0)}84%{transform:translate(-5px,1px)}86%{transform:translate(4px,-2px)}88%{transform:translate(-2px,1px)}90%{transform:translate(0,0)}}
@keyframes jit2{0%,82%,100%{transform:translate(0,0)}84%{transform:translate(5px,-1px)}86%{transform:translate(-4px,2px)}88%{transform:translate(3px,0)}90%{transform:translate(0,0)}}
@keyframes slice{0%,83%,91%,100%{opacity:0;transform:translate(0,0)}84%{opacity:1;transform:translate(14px,0)}86%{opacity:1;transform:translate(-10px,0)}88%{opacity:1;transform:translate(6px,0)}90%{opacity:0}}
@keyframes type{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes sweep{from{transform:translateY(-80px)}to{transform:translateY(440px)}}
@keyframes flow{from{stroke-dashoffset:7}to{stroke-dashoffset:-100}}
@keyframes node{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes boot{from{opacity:0}}
.gc{animation:jit 4.2s steps(1) infinite}
.gm{animation:jit2 4.2s steps(1) infinite}
.sl{animation:slice 4.2s steps(1) infinite}
.cur{animation:blink 1s steps(1) infinite}
.band{animation:sweep 7s linear infinite}
.pc,.pm{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:7 100;animation:flow 2.4s linear infinite}
.pc{stroke:#19f6ff} .pm{stroke:#ff2e88}
.nd{animation:node 2.4s ease-in-out infinite}
.tk{transform-box:fill-box;animation:tick 38s linear infinite}
</style>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#19f6ff" stroke-opacity=".07" stroke-width="1"/></pattern>
  <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity=".35"/></pattern>
  <linearGradient id="band" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#19f6ff" stop-opacity="0"/><stop offset=".5" stop-color="#19f6ff" stop-opacity=".07"/><stop offset="1" stop-color="#19f6ff" stop-opacity="0"/></linearGradient>
  <radialGradient id="glowM" cx=".78" cy=".5" r=".55"><stop offset="0" stop-color="#ff2e88" stop-opacity=".16"/><stop offset="1" stop-color="#ff2e88" stop-opacity="0"/></radialGradient>
