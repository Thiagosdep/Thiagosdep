<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="The stack drawn as a neural network: languages, runtimes, data stores and infrastructure layers feeding a production output node.">
<title>The stack drawn as a neural network: languages, runtimes, data stores and infrastructure layers feeding a production output node.</title>
<style>
text{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

@keyframes flow{from{stroke-dashoffset:7}to{stroke-dashoffset:-100}}
@keyframes node{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.9);opacity:0}}
@keyframes sweep{from{transform:translateY(-80px)}to{transform:translateY(500px)}}
.pc,.pm{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:7 100;animation:flow 3s linear infinite}
.pc{stroke:#19f6ff} .pm{stroke:#ff2e88}
.nd{animation:node 2.6s ease-in-out infinite}
.rg{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
.band{animation:sweep 8s linear infinite}
</style>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#19f6ff" stroke-opacity=".07" stroke-width="1"/></pattern>
  <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity=".35"/></pattern>
  <linearGradient id="band" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#19f6ff" stop-opacity="0"/><stop offset=".5" stop-color="#19f6ff" stop-opacity=".07"/><stop offset="1" stop-color="#19f6ff" stop-opacity="0"/></linearGradient>
  <radialGradient id="glowM" cx=".78" cy=".5" r=".55"><stop offset="0" stop-color="#ff2e88" stop-opacity=".16"/><stop offset="1" stop-color="#ff2e88" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowC" cx=".12" cy=".35" r=".5"><stop offset="0" stop-color="#19f6ff" stop-opacity=".10"/><stop offset="1" stop-color="#19f6ff" stop-opacity="0"/></radialGradient>
  <filter id="neon" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs>
