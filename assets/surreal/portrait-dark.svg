      <ellipse cx="710" cy="330" rx="18" ry="10"/>
    </g>
</g>
<g class="paint" opacity="0">
  <g fill="#07090e">
    <ellipse cx="250" cy="120" rx="46" ry="40"/>
    <ellipse cx="250" cy="130" rx="62" ry="9"/>
    <ellipse cx="250" cy="162" rx="36" ry="44"/>
    <rect x="234" y="198" width="32" height="22"/>
