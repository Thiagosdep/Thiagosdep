      <ellipse cx="490" cy="292" rx="30" ry="16"/>
      <ellipse cx="520" cy="304" rx="28" ry="12"/>
      <ellipse cx="435" cy="308" rx="22" ry="10"/>
      <ellipse cx="620" cy="172" rx="34" ry="13"/>
      <ellipse cx="645" cy="164" rx="26" ry="14"/>
