<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="A painting of a man in a bowler hat whose silhouette is a window onto the sky. Caption: This is not a developer.">
<title>A painting of a man in a bowler hat whose silhouette is a window onto the sky. Caption: This is not a developer.</title>
<style>
  @keyframes in{from{fill-opacity:0}}
  @keyframes vanish{from{opacity:1}to{opacity:0}}
  @keyframes appear{from{opacity:0}}
  @keyframes drift{from{transform:translateX(-320px)}to{transform:translateX(0)}}
  .w1{animation:in .5s .6s ease both}.w2{animation:in .5s 1s ease both}.w3{animation:in .5s 1.4s ease both}.w4{animation:in .5s 1.7s ease both}.w5{animation:in .5s 2.2s ease both}
  .paint{animation:vanish 1.8s 3.3s ease-in-out both}
  .sky{animation:appear 1.8s 3.3s ease-in-out both}
  .ca{animation:drift 90s -30s linear infinite}
  .cb{animation:drift 140s -75s linear infinite}
  @media (prefers-reduced-motion:reduce){.w1,.w2,.w3,.w4,.w5,.paint,.sky,.ca,.cb{animation:none}}
</style>
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2236"/><stop offset="1" stop-color="#121829"/></linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b9bd5"/><stop offset="1" stop-color="#cfe6f5"/></linearGradient>
  <filter id="soft" y="-50%" height="200%"><feGaussianBlur stdDeviation="1.4"/></filter>
  <clipPath id="bust">
    <ellipse cx="250" cy="120" rx="46" ry="40"/>
    <ellipse cx="250" cy="130" rx="62" ry="9"/>
    <ellipse cx="250" cy="162" rx="36" ry="44"/>
    <rect x="234" y="198" width="32" height="22"/>
    <path d="M106 352 C116 262 186 224 250 216 C314 224 384 262 394 352 Z"/>
  </clipPath>
</defs>
<rect width="880" height="360" fill="url(#wall)"/>
