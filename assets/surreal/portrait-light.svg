<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="A painting of a man in a bowler hat whose silhouette is a window onto the sky. Caption: This is not a developer.">
<title>A painting of a man in a bowler hat whose silhouette is a window onto the sky. Caption: This is not a developer.</title>
<style>
  @keyframes in{from{fill-opacity:0}}
  @keyframes vanish{from{opacity:1}to{opacity:0}}
  @keyframes appear{from{opacity:0}}
  @keyframes drift{from{transform:translateX(-320px)}to{transform:translateX(0)}}
  .w1{animation:in .5s .6s ease both}.w2{animation:in .5s 1s ease both}.w3{animation:in .5s 1.4s ease both}.w4{animation:in .5s 1.7s ease both}.w5{animation:in .5s 2.2s ease both}
  .paint{animation:vanish 1.8s 3.3s ease-in-out both}
  .sky{animation:appear 1.8s 3.3s ease-in-out both}
  @keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
  .s1{animation:twinkle 3.2s ease-in-out infinite}.s2{animation:twinkle 4.1s ease-in-out infinite}.s3{animation:twinkle 5.3s ease-in-out infinite}
  .d0{animation-delay:0s}.d1{animation-delay:-.7s}.d2{animation-delay:-1.3s}.d3{animation-delay:-1.9s}.d4{animation-delay:-2.5s}
  .cl{animation:drift 120s -40s linear infinite}
  @media (prefers-reduced-motion:reduce){.w1,.w2,.w3,.w4,.w5,.paint,.sky,.s1,.s2,.s3,.cl{animation:none}}
</style>
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4e8ee"/><stop offset="1" stop-color="#d9dfe7"/></linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1430"/><stop offset="1" stop-color="#1c2b55"/></linearGradient>
  <filter id="soft" y="-50%" height="200%"><feGaussianBlur stdDeviation="1.4"/></filter>
  <clipPath id="bust">
    <ellipse cx="250" cy="120" rx="46" ry="40"/>
    <ellipse cx="250" cy="130" rx="62" ry="9"/>
    <ellipse cx="250" cy="162" rx="36" ry="44"/>
    <rect x="234" y="198" width="32" height="22"/>
    <path d="M106 352 C116 262 186 224 250 216 C314 224 384 262 394 352 Z"/>
  </clipPath>
    <mask id="moon"><rect x="250" y="90" width="44" height="44" fill="#fff"/><circle cx="281" cy="106" r="14" fill="#000"/></mask>
</defs>
<rect width="880" height="360" fill="url(#wall)"/>
<g class="sky" clip-path="url(#bust)">
  <rect x="100" y="60" width="300" height="300" fill="url(#sky)"/>
  <g class="cl" fill="#c9d2e6" opacity=".45" filter="url(#soft)">
      <ellipse cx="170" cy="286" rx="44" ry="9"/>
      <ellipse cx="205" cy="280" rx="30" ry="11"/>
      <ellipse cx="490" cy="286" rx="44" ry="9"/>
      <ellipse cx="525" cy="280" rx="30" ry="11"/>
    </g>
    <g fill="#f1e8c6">
      <circle class="s1 d0" cx="226" cy="104" r="1.8"/>
      <circle class="s2 d3" cx="248" cy="92" r="2.2"/>
      <circle class="s3 d1" cx="236" cy="138" r="1.4"/>
      <circle class="s2 d4" cx="238" cy="170" r="1.6"/>
      <circle class="s1 d2" cx="262" cy="186" r="2.0"/>
      <circle class="s3 d0" cx="250" cy="150" r="1.4"/>
      <circle class="s1 d1" cx="160" cy="300" r="2.4"/>
      <circle class="s3 d4" cx="200" cy="260" r="1.8"/>
      <circle class="s2 d2" cx="300" cy="262" r="1.6"/>
      <circle class="s1 d3" cx="340" cy="300" r="2.2"/>
      <circle class="s2 d0" cx="250" cy="330" r="1.8"/>
      <circle class="s3 d2" cx="130" cy="335" r="1.4"/>
    </g>
    <circle cx="272" cy="112" r="16" fill="#f1e8c6" mask="url(#moon)"/>
</g>
<g class="paint" opacity="0">
  <g fill="#1c2230">
    <ellipse cx="250" cy="120" rx="46" ry="40"/>
    <ellipse cx="250" cy="130" rx="62" ry="9"/>
    <ellipse cx="250" cy="162" rx="36" ry="44"/>
    <rect x="234" y="198" width="32" height="22"/>
    <path d="M106 352 C116 262 186 224 250 216 C314 224 384 262 394 352 Z"/>
  </g>
  <polygon points="236,214 250,232 264,214" fill="#f4f2ec"/>
  <polygon points="246,218 254,218 258,262 250,272 242,262" fill="#7a2e2e"/>
</g>
<text x="620" y="208" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="34" fill="#1f2430"><tspan class="w1" fill-opacity="1">This</tspan> <tspan class="w2" fill-opacity="1">is</tspan> <tspan class="w3" fill-opacity="1">not</tspan> <tspan class="w4" fill-opacity="1">a</tspan> <tspan class="w5" fill-opacity="1">developer.</tspan></text>
<text x="846" y="338" text-anchor="end" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="13" fill="#1f2430" opacity=".55">Thiagosdep</text>
<g fill="none">
  <rect x="8" y="8" width="864" height="344" stroke="#8a7a52" stroke-width="6"/>
  <rect x="12" y="12" width="856" height="336" stroke="#3b3426" stroke-width="1" opacity=".8"/>
</g>
</svg>
